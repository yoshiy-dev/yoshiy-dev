<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;background:transparent}
svg{display:block;width:320px;height:320px;margin:0 0 8px}
svg *{stroke:#3C3C3C;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.w{fill:#fff}.a{fill:#4669B0}.n{fill:none}.as{stroke:#4669B0}
</style></head><body>
<!-- 入口（扉） -->
<svg id="door" viewBox="0 0 160 160"><rect class="w" x="40" y="20" width="80" height="124" rx="4"/><path class="n" d="M40 144h80"/><path class="a" d="M58 34l44 10v92l-44-6z"/><circle class="w" cx="90" cy="88" r="5"/></svg>
<!-- 鎖（弱点をつなぐ・攻撃の組み立て） -->
<svg id="chain" viewBox="0 0 160 160"><rect class="w" x="18" y="58" width="72" height="44" rx="22" transform="rotate(-35 54 80)"/><rect class="w" x="70" y="58" width="72" height="44" rx="22" transform="rotate(-35 106 80)"/><path class="n as" d="M64 96l32-32" style="stroke-width:10"/></svg>
<!-- クラウド -->
<svg id="cloud" viewBox="0 0 160 160"><path class="w" d="M46 118h72a26 26 0 0 0 2-52 34 34 0 0 0-64-6 28 28 0 0 0-10 58z"/><path class="n as" d="M58 100h44" style="stroke-width:8"/></svg>
<!-- 偵察（虫めがね） -->
<svg id="search" viewBox="0 0 160 160"><circle class="w" cx="68" cy="68" r="42"/><circle class="a" cx="68" cy="68" r="18"/><path class="n" d="M100 100l38 38" style="stroke-width:12"/></svg>
<!-- 弱点の発見（警告） -->
<svg id="warn" viewBox="0 0 160 160"><path class="w" d="M80 20l66 116H14z"/><path class="n as" d="M80 62v38" style="stroke-width:10"/><circle class="a" cx="80" cy="118" r="5" style="stroke:#4669B0"/></svg>
<!-- 報告書（チェック付き） -->
<svg id="report" viewBox="0 0 160 160"><path class="w" d="M36 16h64l26 26v102H36z"/><path class="n" d="M100 16v26h26M54 62h48M54 84h32"/><path class="n as" d="M58 116l16 14 30-30" style="stroke-width:9"/></svg>
<!-- GPU（チップ） -->
<svg id="gpu" viewBox="0 0 160 160"><path class="n" d="M58 22v18M80 22v18M102 22v18M58 120v18M80 120v18M102 120v18M22 58h18M22 80h18M22 102h18M120 58h18M120 80h18M120 102h18"/><rect class="w" x="40" y="40" width="80" height="80" rx="8"/><rect class="a" x="60" y="60" width="40" height="40" rx="4"/></svg>
<!-- 通信の記録（一覧） -->
<svg id="log" viewBox="0 0 160 160"><rect class="w" x="26" y="22" width="108" height="116" rx="6"/><path class="n" d="M64 52h50M64 80h50M64 108h50"/><circle class="a" cx="46" cy="52" r="6"/><circle class="a" cx="46" cy="80" r="6"/><circle class="a" cx="46" cy="108" r="6"/></svg>
<!-- メール -->
<svg id="mail" viewBox="0 0 160 160"><rect class="w" x="18" y="38" width="124" height="86" rx="6"/><path class="n as" d="M22 44l58 46 58-46" style="stroke-width:8"/></svg>
<!-- 範囲の合意（クリップボード） -->
<svg id="scope" viewBox="0 0 160 160"><rect class="w" x="32" y="26" width="96" height="118" rx="6"/><rect class="a" x="58" y="16" width="44" height="22" rx="4"/><path class="n" d="M52 70h56M52 94h56M52 118h30"/></svg>
</body></html>
